---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apiserver-ingress
portSelector:
  ports:
    - 6443
  protocol: tcp
ingress:
  - subnet: 0.0.0.0/0
  - subnet: ::/0
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: trustd-ingress
portSelector:
  ports:
    - 50001
  protocol: tcp
ingress:
  - subnet: 192.168.1.25/32
  - subnet: 192.168.1.26/32
  - subnet: 192.168.1.27/32
---
# Control-plane IPs only; workers never talk to etcd directly.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: etcd-ingress
portSelector:
  ports:
    - 2379-2380
  protocol: tcp
ingress:
  - subnet: 192.168.1.25/32
  - subnet: 192.168.1.26/32
  - subnet: 192.168.1.27/32
