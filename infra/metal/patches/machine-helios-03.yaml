---
machine:
  sysctls:
    vm.nr_hugepages: "1024"
  network:
    $patch: delete
  features:
    stableHostname:
      $patch: delete
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers:
      $patch: delete
    openebs.io/engine: mayastor
  kubelet:
    extraMounts:
      - destination: /var/local
        type: bind
        source: /var/local
        options:
          - bind
          - rshared
          - rw
  install:
    disk: /dev/disk/by-id/nvme-eui.002538b921b6cf77
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: helios-03
auto: off
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.1.1
---
# Explicit LinkConfig disables the default DHCP-on-all-links behavior.
# Omitting destination creates a default route for the gateway's address family.
apiVersion: v1alpha1
kind: LinkConfig
name: enp110s0
addresses:
  - address: 192.168.1.27/24
routes:
  - gateway: 192.168.1.1
