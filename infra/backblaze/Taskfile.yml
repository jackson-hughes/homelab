---
# https://taskfile.dev

version: '3'

env:
  B2_APPLICATION_KEY_ID:
    sh: op read op://Homelab/backblaze-terraform/keyID
  B2_APPLICATION_KEY:
    sh: op read op://Homelab/backblaze-terraform/applicationKey

tasks:
  default:
    cmds:
      - task -l
    silent: true

  setup:
    run: once
    desc: Runs terraform init
    cmds:
      - terraform init

  plan:
    deps: [setup]
    desc: Runs terraform plan against current project
    cmds:
      - terraform plan

  apply:
    deps: [setup]
    desc: Runs terraform apply against current project
    cmds:
      - terraform apply -auto-approve
