---
name: metal

on:
  pull_request:
    paths: &paths
      - infra/metal/**
      - scripts/check-talos-version.sh
      - .github/workflows/metal.yaml
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Not Renovate-managed: bump each SHA256 with its version, from the
# release's published checksums file for the linux-amd64 asset.
env:
  TOPF_VERSION: v0.6.0
  TOPF_SHA256: 458df4b25f4181a31ed361c0592194f7eb9e6e7b13e7096f8745453afdeaadfb
  TALOSCTL_VERSION: v1.13.9
  TALOSCTL_SHA256: 7e1d4b7d5846964bdcf63a794e3c8161bb6ef2983d5ace58ea5322f3bf32a27e

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: ./scripts/check-talos-version.sh

      - name: Install topf and talosctl
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/dl" && cd "$RUNNER_TEMP/dl"
          curl -sfL -o topf.tar.gz "https://github.com/postfinance/topf/releases/download/${TOPF_VERSION}/topf_linux_amd64.tar.gz"
          curl -sfL -o talosctl "https://github.com/siderolabs/talos/releases/download/${TALOSCTL_VERSION}/talosctl-linux-amd64"
          echo "${TOPF_SHA256}  topf.tar.gz" | sha256sum -c -
          echo "${TALOSCTL_SHA256}  talosctl" | sha256sum -c -
          tar xzf topf.tar.gz -C "$RUNNER_TEMP/bin" topf
          install -m 0755 talosctl "$RUNNER_TEMP/bin/talosctl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render and validate machine configs
        run: |
          # Throwaway bundle for CI only. Never the real cluster secrets.
          talosctl gen secrets -o infra/metal/secrets.yaml

          schematic_id="$(topf schematic-ids --topfconfig infra/metal/topf.yaml)"
          if [ "$(printf '%s\n' "${schematic_id}" | wc -l)" -ne 1 ]; then
            echo "error: expected exactly one schematic ID from topf schematic-ids:" >&2
            printf '  %s\n' "${schematic_id}" >&2
            exit 1
          fi

          out="$RUNNER_TEMP/out"
          mkdir -p "${out}"
          topf render --topfconfig infra/metal/topf.yaml -o "${out}"

          pin="$(awk '/^talosVersion:/{gsub(/["'\'']/, "", $2); print $2; exit}' infra/metal/topf.yaml)"
          expected_image="factory.talos.dev/metal-installer/${schematic_id}:${pin}"
          shopt -s nullglob
          files=("${out}"/*.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: topf render wrote no yaml files to ${out}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            talosctl validate --config "${f}" --mode metal
            if ! grep -q "${expected_image}" "${f}"; then
              echo "error: ${f} does not contain ${expected_image}" >&2
              exit 1
            fi
          done
