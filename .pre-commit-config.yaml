---
# Local companion to the fast CI checks (.github/workflows/) — not a full
# mirror: flate test/diff, terraform validate, and the full-history gitleaks
# scan run only in CI. Setup:
#   brew bundle
#   (cd infra/terraform/kvm && tfenv install)
#   pre-commit install
#
# The kubernetes hook needs network on its first run (and when new resource
# kinds appear) to fetch JSON schemas; kubeconform caches them for later
# offline runs. The schematic check (scripts/check-schematic.sh) is CI-only
# because every run must reach factory.talos.dev.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: validate-kubernetes
        name: kustomize build + kubeconform
        entry: scripts/validate-kubernetes.sh
        language: script
        files: ^kubernetes/
        pass_filenames: false

      # Roots are derived from the .terraform-version glob so new stacks are
      # covered automatically, and failures accumulate so an early root's
      # violation isn't masked by a clean later one.
      - id: terraform-fmt
        name: terraform fmt -check
        entry: bash -c 'rc=0; for d in infra/terraform/*/; do [ -f "${d}.terraform-version" ] || continue; (cd "${d}" && terraform fmt -check -recursive) || rc=1; done; exit "${rc}"'
        language: system
        files: ^infra/terraform/
        pass_filenames: false
