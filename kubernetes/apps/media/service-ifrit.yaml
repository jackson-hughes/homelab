# The *arr stack and nzbget still run as Docker containers on ifrit, sharing
# gluetun's network namespace; gluetun publishes their ports on ifrit's host
# interface. These two objects let the cluster treat that host as an ordinary
# backend so the routes below can be plain HTTPRoutes.
apiVersion: v1
kind: Service
metadata:
  name: ifrit-media
  namespace: media
spec:
  # No selector: there are no pods to match. That also stops the endpoint
  # controller from generating an EndpointSlice, so we supply one by hand.
  ports:
    - name: nzbget
      port: 6789
      targetPort: 6789
    - name: radarr
      port: 7878
      targetPort: 7878
    - name: sonarr
      port: 8989
      targetPort: 8989
    - name: prowlarr
      port: 9696
      targetPort: 9696
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ifrit-media
  namespace: media
  labels:
    # Required. This is the only thing tying the slice to the Service above;
    # without it the Service resolves to nothing and Traefik returns 503.
    kubernetes.io/service-name: ifrit-media
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.123 # ifrit
    # Nothing health-checks a hand-written slice, unlike the Consul registration
    # this replaces. If ifrit is down the route stays programmed and returns 502.
    conditions:
      ready: true
ports:
  # Port names must match the Service's; Traefik resolves the backendRef to a
  # Service port and then looks up the same name here.
  - name: nzbget
    port: 6789
  - name: radarr
    port: 7878
  - name: sonarr
    port: 8989
  - name: prowlarr
    port: 9696
