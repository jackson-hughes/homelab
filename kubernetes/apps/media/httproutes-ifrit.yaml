# Replaces the Consul-catalog tags that used to drive the Traefik instance on
# ifrit. Hostnames move from *.svc.ducknet.io to *.ducknet.io so they fall under
# the gateway's existing wildcard certificate; a *.ducknet.io wildcard would not
# have matched the extra label. external-dns picks these up from the
# gateway-httproute source and points them at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nzbget
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - nzb.ducknet.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ifrit-media
          port: 6789
---
