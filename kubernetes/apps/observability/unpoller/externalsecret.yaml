apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller-config
  namespace: unpoller
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpoller-config
    creationPolicy: Owner
    # The chart mounts one secret key as /etc/unpoller/up.conf, so the whole
    # config is templated here rather than split between values and env.
    template:
      data:
        up.conf: |
          [poller]
            debug = false
            quiet = false
            plugins = []
          [prometheus]
            disable = false
            http_listen = "0.0.0.0:9130"
            report_errors = false
          [influxdb]
            disable = true
          [loki]
            disable = true
          [unifi]
            dynamic = false
          [[unifi.controller]]
            url         = "https://192.168.1.1"
            user        = "{{ .username }}"
            pass        = "{{ .password }}"
            sites       = ["all"]
            save_dpi    = true
            save_sites  = true
            save_ids    = false
            hash_pii    = false
            verify_ssl  = false
  data:
    - secretKey: username
      remoteRef:
        key: unifi-poller-service-account/username
    - secretKey: password
      remoteRef:
        key: unifi-poller-service-account/password
