apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
  namespace: unpoller
spec:
  releaseName: unpoller
  chart:
    spec:
      # Pinned rather than ranged: the chart's repo index also carries
      # 2.11.2-Chart6, which semver-sorts above this but ships appVersion
      # v2.11.2 — an older unpoller than 2.4.0's v3.5.0.
      chart: unpoller
      version: "2.4.0"
      sourceRef:
        kind: HelmRepository
        name: unpoller
  interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: unpoller

    upConfigExistingSecret:
      name: unpoller-config
      key: up.conf

    podMonitor:
      enabled: false

    dashboards:
      create: false
      grafana:
        create: false

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
