apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
  namespace: victoria-metrics
spec:
  releaseName: vm
  dependsOn:
    - name: vm-operator
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.90.2"
      sourceRef:
        kind: HelmRepository
        name: vm
  interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vm-kube-state-metrics-flux-values
      valuesKey: values.yaml
  values:
    fullnameOverride: vm
    victoria-metrics-operator:
      enabled: false
      crds:
        cleanup:
          enabled: false
    defaultDashboards:
      enabled: true
    defaultDatasources:
      extra:
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://vlselect-vl.victoria-metrics.svc:9471
          uid: VictoriaLogs
          version: 1
          orgId: 1
          isDefault: false
          editable: false
    defaultRules:
      enabled: true
      rules:
        Watchdog:
          enabled: false
    grafana:
      enabled: true
      # Route dashboards to folders by ConfigMap annotation.
      sidecar:
        dashboards:
          # The VM stack overrides this onto /var/lib/grafana/dashboards, where
          # its emptyDir shadows the directory the chart reserves for
          # dashboardProviders. Restore the chart default.
          folder: /tmp/dashboards
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true

      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: unifi
              orgId: 1
              folder: Unifi
              type: file
              disableDeletion: false
              allowUiUpdates: false
              options:
                path: /var/lib/grafana/dashboards/unifi
            - name: garage
              orgId: 1
              folder: Garage
              type: file
              disableDeletion: false
              allowUiUpdates: false
              options:
                path: /var/lib/grafana/dashboards/garage
      dashboards:
        unifi:
          # DS_UNIFI_POLLER is an undefined variable left by upstream.
          unifi-clients:
            gnetId: 11315
            revision: 9
            title: "UniFi-Poller: Client Insights"
            datasource:
              - name: DS_PROMETHEUS
                value: VictoriaMetrics
              - name: DS_UNIFI_POLLER
                value: VictoriaMetrics
          unifi-uap:
            gnetId: 11314
            revision: 10
            title: "UniFi-Poller: UAP Insights"
            datasource:
              - name: DS_PROMETHEUS
                value: VictoriaMetrics
              - name: DS_UNIFI_POLLER
                value: VictoriaMetrics
          unifi-usg:
            gnetId: 11313
            revision: 9
            title: "UniFi-Poller: USG Insights"
            datasource:
              - name: DS_PROMETHEUS
                value: VictoriaMetrics
              - name: DS_UNIFI_POLLER
                value: VictoriaMetrics
          unifi-usw:
            gnetId: 11312
            revision: 9
            title: "UniFi-Poller: USW Insights"
            datasource:
              - name: DS_PROMETHEUS
                value: VictoriaMetrics
              - name: DS_UNIFI_POLLER
                value: VictoriaMetrics
        garage:
          garage:
            url: https://raw.githubusercontent.com/deuxfleurs-org/garage/v2.3.0/script/telemetry/grafana-garage-dashboard-prometheus.json
            datasource:
              - name: DS_DS_PROMETHEUS
                value: VictoriaMetrics
      admin:
        existingSecret: vm-grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      plugins:
        - victoriametrics-logs-datasource
      deploymentStrategy:
        type: Recreate
      ingress:
        enabled: false
      persistence:
        enabled: true
        type: pvc
        accessModes:
          - ReadWriteOnce
        storageClassName: mayastor-2
        size: 20Gi
      grafana.ini:
        server:
          domain: grafana.ducknet.io
          root_url: https://grafana.ducknet.io
    alertmanager:
      enabled: true
      route:
        enabled: false
      useManagedConfig: true
      config:
        route:
          receiver: pushover
          routes:
            - matchers:
                - alertname = InfoInhibitor
              receiver: blackhole
        receivers:
          - name: blackhole
          - name: pushover
            pushover_configs:
              - token:
                  name: pushover-credentials
                  key: vmalert_token
                user_key:
                  name: pushover-credentials
                  key: user_key
                send_resolved: true
        inhibit_rules:
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
      spec:
        externalURL: https://alerts.ducknet.io
        replicaCount: 1
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: mayastor-2
              resources:
                requests:
                  storage: 20Gi
    vmauth:
      enabled: false
    vmsingle:
      enabled: false
    vmagent:
      enabled: true
      spec:
        replicaCount: 1
    vmalert:
      enabled: true
      spec:
        replicaCount: 1
        extraArgs:
          external.url: https://grafana.ducknet.io
    vmcluster:
      enabled: true
      spec:
        replicationFactor: 1
        retentionPeriod: 60d
        vmstorage:
          replicaCount: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - vmstorage
                    topologyKey: kubernetes.io/hostname
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: mayastor-2
                resources:
                  requests:
                    storage: 50Gi
        vmselect:
          replicaCount: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - vmselect
                    topologyKey: kubernetes.io/hostname
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: mayastor-2
                resources:
                  requests:
                    storage: 2Gi
        vminsert:
          replicaCount: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - vminsert
                    topologyKey: kubernetes.io/hostname
    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: true
    kubeApiServer:
      enabled: true
    # Both are reachable only because infra/metal/patches/cluster-controlplane-metrics.yaml
    # sets bind-address=0.0.0.0; Talos defaults them to 127.0.0.1. The chart's default
    # selector (component: kube-*) already matches the Talos static pods.
    #
    # Talos runs these without --tls-cert-file, so each generates a self-signed serving
    # cert that the cluster CA cannot verify. Replace the chart's default caFile with
    # insecureSkipVerify; the scrape is still authenticated by the bearer token.
    kubeControllerManager:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeEtcd:
      enabled: false
    kubelet:
      enabled: true
      # The chart maps every node label onto every kubelet/cadvisor series. NFD
      # publishes ~78 feature.node.kubernetes.io labels per node, which pushed
      # series past vminsert's -maxLabelsPerTimeseries (40) and silently dropped
      # the whole kubelet job. Drop them back off; nothing queries them.
      vmScrape:
        spec:
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: feature_node_kubernetes_io_.+
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
    kubeProxy:
      enabled: false
