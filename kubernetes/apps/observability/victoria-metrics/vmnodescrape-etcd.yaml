apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: etcd
  namespace: victoria-metrics
spec:
  interval: 30s
  scrapeTimeout: 5s
  scheme: http
  port: "2381"
  path: /metrics
  selector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  # Deliberately no `labelmap __meta_kubernetes_node_label_(.+)`: mapping node
  # labels onto every etcd series pushes it past vminsert's
  # -maxLabelsPerTimeseries (40), which silently discards the whole job. NFD
  # (~78 labels) and KubeVirt's node-labeller (~405) each did it. The operator
  # sets `node` from __meta_kubernetes_node_name regardless.
  relabelConfigs:
    - replacement: etcd
      targetLabel: job
