apiVersion: batch/v1
kind: CronJob
metadata:
  name: ping
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ping
              image: curlimages/curl:8.22.0
              env:
                - name: HC_PING_URL
                  valueFrom:
                    secretKeyRef:
                      name: healthchecks-io-ping
                      key: url
              command:
                - curl
                - -fsS
                - -m
                - "10"
                - --retry
                - "5"
                - -o
                - /dev/null
                - "$(HC_PING_URL)"
          restartPolicy: Never
