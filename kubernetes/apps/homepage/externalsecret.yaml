# Credentials for the media service widgets. One secret rather than four:
# homepage consumes them all as env vars on the same pod, so splitting them
# would only add objects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-widget-secrets
  namespace: homepage
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-widget-secrets
    creationPolicy: Owner
  data:
    - secretKey: sonarr-api-key
      remoteRef:
        key: sonarr-api-key/api-key
    - secretKey: radarr-api-key
      remoteRef:
        key: radarr-api-key/api-key
    - secretKey: prowlarr-api-key
      remoteRef:
        key: prowlarr-api-key/api-key
    # NZBGet's widget authenticates with ControlUsername/ControlPassword over
    # basic auth rather than an API key.
    - secretKey: nzbget-username
      remoteRef:
        key: nzbget-credentials/username
    - secretKey: nzbget-password
      remoteRef:
        key: nzbget-credentials/password
