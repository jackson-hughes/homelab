apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  releaseName: homepage
  chart:
    spec:
      chart: homepage
      version: "^2.0.0"
      sourceRef:
        kind: HelmRepository
        name: homepage
  interval: 24h
  install:
    remediation:
      retries: 3
  values:
    enableRbac: true
    serviceAccount:
      create: true

    # HOMEPAGE_ALLOWED_HOSTS is required; this value replaces the chart default
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: "home.ducknet.io"
      - name: HOMEPAGE_VAR_SONARR_KEY
        valueFrom:
          secretKeyRef:
            name: homepage-widget-secrets
            key: sonarr-api-key
      - name: HOMEPAGE_VAR_RADARR_KEY
        valueFrom:
          secretKeyRef:
            name: homepage-widget-secrets
            key: radarr-api-key
      - name: HOMEPAGE_VAR_PROWLARR_KEY
        valueFrom:
          secretKeyRef:
            name: homepage-widget-secrets
            key: prowlarr-api-key
      - name: HOMEPAGE_VAR_NZBGET_USERNAME
        valueFrom:
          secretKeyRef:
            name: homepage-widget-secrets
            key: nzbget-username
      - name: HOMEPAGE_VAR_NZBGET_PASSWORD
        valueFrom:
          secretKeyRef:
            name: homepage-widget-secrets
            key: nzbget-password
      - name: HOMEPAGE_VAR_PLEX_TOKEN
        valueFrom:
          secretKeyRef:
            name: homepage-widget-secrets
            key: plex-token

    # We use HTTPRoute instead of the chart's ingress
    ingress:
      main:
        enabled: false

    config:
      kubernetes:
        mode: cluster
        gateway: true

      settings:
        title: Homelab

      bookmarks:
        - Cluster:
            - GitHub:
                - abbr: GH
                  href: https://github.com/jackson-hughes/homelab

      services:
        - Infrastructure:
            - Garage (S3):
                href: https://s3.ducknet.io
                description: Object storage
            - Grafana:
                href: https://grafana.ducknet.io
                description: Dashboards
            - Alertmanager:
                href: https://alerts.ducknet.io
                description: Alerts
            - Victoria Metrics:
                href: https://metrics.ducknet.io
                description: Time-series database
            - Victoria Logs:
                href: https://logs.ducknet.io
                description: Logs
        - Media:
            - Plex:
                href: https://plex.ducknet.io
                description: Media server
                widget:
                  type: plex
                  url: http://plex.media.svc.cluster.local:32400
                  key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
            - Sonarr:
                href: https://tv.ducknet.io
                description: TV
                widget:
                  type: sonarr
                  url: http://usenet.media.svc.cluster.local:8989
                  key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
            - Radarr:
                href: https://movies.ducknet.io
                description: Movies
                widget:
                  type: radarr
                  url: http://usenet.media.svc.cluster.local:7878
                  key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
            - Prowlarr:
                href: https://prowlarr.ducknet.io
                description: Indexers
                widget:
                  type: prowlarr
                  url: http://usenet.media.svc.cluster.local:9696
                  key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
            - NZBGet:
                href: https://nzb.ducknet.io
                description: Usenet downloader
                widget:
                  type: nzbget
                  url: http://usenet.media.svc.cluster.local:6789
                  username: "{{HOMEPAGE_VAR_NZBGET_USERNAME}}"
                  password: "{{HOMEPAGE_VAR_NZBGET_PASSWORD}}"

      widgets:
        # The kubernetes widget queries metrics-server unconditionally; re-enable
        # it once metrics-server is installed on the cluster.
        - search:
            provider: google
            target: _blank
