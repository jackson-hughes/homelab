apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  releaseName: flux-operator
  chart:
    spec:
      chart: flux-operator
      version: "^0.59.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator
  interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    priorityClassName: system-cluster-critical
