apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  releaseName: flux-operator
  chart:
    spec:
      chart: flux-operator
      version: "^0.59.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator
  interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # No serviceAccountName: the chart creates the flux-operator service account, so
  # naming it here would make the first reconcile depend on an object this release
  # has not created yet.
  values:
    # Flux itself is what recovers this cluster, so the operator that installs it
    # should not be the first thing evicted under node pressure.
    priorityClassName: system-cluster-critical
