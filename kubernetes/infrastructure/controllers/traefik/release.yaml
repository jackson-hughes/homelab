apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "^42.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
  interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    ports:
      web:
        port: 80
      websecure:
        port: 443
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.ducknet.io`)
        entryPoints:
          - web
          - websecure
    providers:
      kubernetesGateway:
        enabled: true
        experimentalChannel: false
    gateway:
      # A route outside these namespaces stays unattached
      # (NotAllowedByListeners), and external-dns ignores it too. A route
      # with no spec.hostnames inherits the listener hostname, so external-dns
      # would publish *.ducknet.io for it.
      listeners:
        web:
          port: 80
          hostname: "*.ducknet.io"
          namespacePolicy: &routeNamespaces
            from: Selector
            selector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - flux-system
                    - garage
                    - homepage
                    - media
                    - podinfo
                    - victoria-metrics
        websecure:
          port: 443
          protocol: HTTPS
          hostname: "*.ducknet.io"
          namespacePolicy: *routeNamespaces
          certificateRefs:
            - kind: Secret
              name: traefik-ducknet-tls
    metrics:
      prometheus:
        service:
          enabled: true
    additionalArguments:
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
