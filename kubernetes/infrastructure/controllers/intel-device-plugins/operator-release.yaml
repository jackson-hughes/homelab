apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: inteldeviceplugins-system
spec:
  releaseName: intel-device-plugins-operator
  # Upstream: "The default operator deployment depends on NFD and cert-manager.
  # Those components have to be installed to the cluster before the operator can
  # be deployed."
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: node-feature-discovery
      namespace: node-feature-discovery
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: "0.36.0"
      sourceRef:
        kind: HelmRepository
        name: intel
  interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
