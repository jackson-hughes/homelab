apiVersion: v1
kind: Namespace
metadata:
  name: inteldeviceplugins-system
  labels:
    # The GPU plugin DaemonSet needs host access to /dev/dri, which Talos'
    # default `baseline` PodSecurity enforcement rejects. Namespace labels
    # override the cluster-wide default.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
