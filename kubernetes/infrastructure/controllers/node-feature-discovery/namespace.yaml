apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
  labels:
    # nfd-worker mounts /boot, /etc/os-release, /sys, /usr/lib, /lib, /proc/swaps
    # and /usr/src as hostPaths, which Talos' default `baseline` PodSecurity
    # enforcement rejects. Namespace labels override the cluster-wide default.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
