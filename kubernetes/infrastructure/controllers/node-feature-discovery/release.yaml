apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  releaseName: node-feature-discovery
  chart:
    spec:
      chart: node-feature-discovery
      version: "0.19.0"
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
  interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  # NFD owns the NodeFeatureRule CRD that intel-device-plugins-gpu creates, and
  # evaluates it to apply the intel.feature.node.kubernetes.io/gpu label that the
  # GPU plugin DaemonSet selects on.
