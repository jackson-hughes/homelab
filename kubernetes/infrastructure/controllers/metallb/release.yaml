apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      version: "^0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    speaker:
      ignoreExcludeLB: true
    frrk8s:
      enabled: false
  interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
