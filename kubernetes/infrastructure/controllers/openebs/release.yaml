apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  releaseName: openebs
  chart:
    spec:
      chart: openebs
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: openebs
  interval: 24h
  # io-engine is OnDelete, which kstatus never sees as rolled out; Helm's own
  # wait treats it as ready. Roll it with scripts/roll-io-engine.sh.
  waitStrategy:
    name: legacy
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    loki:
      enabled: false
    alloy:
      enabled: false
    mayastor:
      obs:
        callhome:
          enabled: false
      io_engine:
        envcontext: iova-mode=pa
      csi:
        node:
          initContainers:
            enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: true
