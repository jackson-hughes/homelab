apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  # Enforced by scripts/validate-kubernetes.sh: an ExternalSecret in an
  # unlisted namespace fails to sync.
  conditions:
    - namespaces:
        - cert-manager
        - external-dns
        - garage
        - healthchecks-io
        - homepage
        - unpoller
        - velero
        - victoria-metrics
  refreshInterval: 86400
  retrySettings:
    maxRetries: 3
    retryInterval: 5m
  provider:
    onepasswordSDK:
      vault: Homelab
      cache:
        maxSize: 50
        ttl: 1h
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account-token
          namespace: external-secrets
          key: token
